# Build pi5's u-boot and publish it as a release asset.
#
# The estate's control plane boots from this binary. Before this workflow
# existed it was produced by a shell script on one workstation, with the
# config carried as a heredoc fragment appended to .config -- so the thing
# standing between the cluster and a boot was unreviewable and unbuildable
# by anyone else. The patches now live in git (see the hive branch) and the
# binary is built here.
name: build

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # u-boot stamps `git describe` into the binary

      # PINNED TOOLCHAIN, deliberately. The first CI run of this workflow used
      # the runner's own gcc-aarch64-linux-gnu and produced a 727720-byte
      # binary, where the pinned container produces 728928 -- same source,
      # 1208 bytes of difference. For an ordinary program that is noise; for
      # the bootloader of the estate's sole control plane it means the
      # artifact CI publishes is not the artifact that was tested. A moving
      # toolchain also makes the build unreproducible, so a future binary
      # could not be compared against this one.
      - name: build in the pinned toolchain container
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            debian:bookworm-20250908-slim bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                gcc-aarch64-linux-gnu build-essential git bison flex libssl-dev \
                device-tree-compiler python3 python3-dev python3-setuptools swig \
                bc ca-certificates uuid-dev libgnutls28-dev >/dev/null
              git config --global --add safe.directory /work
              export CROSS_COMPILE=aarch64-linux-gnu- ARCH=arm
              make rpi_5_defconfig >/dev/null

              # Kconfig SILENTLY DROPS an option whose dependencies are unmet.
              # Without this the build succeeds, the binary looks fine, and the
              # failure only reappears on the node -- after a flash, far from
              # its cause. EFI_RT_VOLATILE_STORE is the one Talos needs; the
              # others are its dependencies and the devicetree path fix.
              fail=0
              for o in CONFIG_FAT_WRITE CONFIG_EFI_VARIABLE_FILE_STORE \
                       CONFIG_EFI_RT_VOLATILE_STORE CONFIG_OF_UPSTREAM; do
                if grep -qx "${o}=y" .config; then
                  echo "ok   ${o}=y"
                else
                  echo "MISSING ${o}"
                  fail=1
                fi
              done
              [ "$fail" = 0 ] || { echo "refusing to ship a binary that would fail the same way"; exit 1; }

              make -j"$(nproc)"
            '

      - name: stamp
        run: |
          mkdir -p artifacts
          cp u-boot.bin artifacts/
          cp .config artifacts/u-boot.config
          ( cd artifacts && sha256sum u-boot.bin > SHA256SUMS )
          echo "--- version string baked into the binary ---"
          strings -t d artifacts/u-boot.bin | grep -m1 "U-Boot 20"

      - uses: actions/upload-artifact@v4
        with:
          name: u-boot-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

      - name: release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          body: |
            pi5 u-boot with `CONFIG_EFI_RT_VOLATILE_STORE`, built from the `hive` branch.

            Without it `talosctl upgrade` fails at the bootloader step with
            `failed to create efivarfs reader/writer: invalid argument`, because
            Linux only permits the efivarfs rw remount when the firmware
            advertises SetVariable at runtime.

            Verify with `sha256sum -c SHA256SUMS`.
