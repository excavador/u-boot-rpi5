# Build pi5's u-boot and publish it as a release asset.
#
# The estate's control plane boots from this binary. Before this workflow
# existed it was produced by a shell script on one workstation, with the
# config carried as a heredoc fragment appended to .config -- so the thing
# standing between the cluster and a boot was unreviewable and unbuildable
# by anyone else. The patches now live in git (see the hive branch) and the
# binary is built here.
name: build

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # u-boot stamps `git describe` into the binary

      # PINNED TOOLCHAIN, deliberately. The first CI run of this workflow used
      # the runner's own gcc-aarch64-linux-gnu and produced a 727720-byte
      # binary, where the pinned container produces 728928 -- same source,
      # 1208 bytes of difference. For an ordinary program that is noise; for
      # the bootloader of the estate's sole control plane it means the
      # artifact CI publishes is not the artifact that was tested. A moving
      # toolchain also makes the build unreproducible, so a future binary
      # could not be compared against this one.
      #
      # SOURCE_DATE_EPOCH, also deliberately. Measured 2026-09-29: without
      # it, u-boot embeds the wall-clock build time in its version banner, so
      # the release asset published for v2025.04-rpi5-3-hive.2 differs from a
      # from-source rebuild of the same commit by 24 bytes -- the build date
      # and nothing else. Pinning it to the checked-out commit's own date
      # makes the build a pure function of that commit: rebuilding the same
      # ref, now or in a year, reproduces the same bytes. A new tag naturally
      # gets a new date (and a new `-g<sha>` from CONFIG_LOCALVERSION_AUTO,
      # which is on by default) because it is built from a different commit
      # -- that is not drift, it is two different releases correctly saying
      # so in their own version strings.
      - name: build in the pinned toolchain container, twice, and compare
        run: |
          epoch=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=$epoch (this commit's date)"

          build() { # <out-dir> -- builds the checked-out tree in place, then
                    # copies the result out before the next round cleans it.
            docker run --rm -v "$PWD:/work" -w /work \
              -e SOURCE_DATE_EPOCH="$epoch" -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
              debian:bookworm-20250908-slim@sha256:df52e55e3361a81ac1bead266f3373ee55d29aa50cf0975d440c2be3483d8ed3 \
              bash -euo pipefail -c '
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -qq
                apt-get install -y -qq --no-install-recommends \
                  gcc-aarch64-linux-gnu build-essential git bison flex libssl-dev \
                  device-tree-compiler python3 python3-dev python3-setuptools swig \
                  bc ca-certificates uuid-dev libgnutls28-dev >/dev/null
                git config --global --add safe.directory /work
                export CROSS_COMPILE=aarch64-linux-gnu- ARCH=arm
                make rpi_5_defconfig >/dev/null

                # Kconfig SILENTLY DROPS an option whose dependencies are
                # unmet. Without this the build succeeds, the binary looks
                # fine, and the failure only reappears on the node -- after a
                # flash, far from its cause. EFI_RT_VOLATILE_STORE is the one
                # Talos needs; the others are its dependencies and the
                # devicetree path fix.
                fail=0
                for o in CONFIG_FAT_WRITE CONFIG_EFI_VARIABLE_FILE_STORE \
                         CONFIG_EFI_RT_VOLATILE_STORE CONFIG_OF_UPSTREAM; do
                  if grep -qx "${o}=y" .config; then
                    echo "ok   ${o}=y"
                  else
                    echo "MISSING ${o}"
                    fail=1
                  fi
                done
                [ "$fail" = 0 ] || { echo "refusing to ship a binary that would fail the same way"; exit 1; }

                make -j"$(nproc)"
                # The imager and every other tool in this container run as
                # root; hand the tree back to the runner user so the outer
                # `git clean` between rounds does not choke on root-owned
                # object files.
                chown -R "$HOST_UID:$HOST_GID" /work
              '
            mkdir -p "$1"
            cp u-boot.bin .config "$1/"
            git clean -qfdx
          }

          # Reproducibility is asserted directly, every run, rather than
          # against a value recorded once and left to rot: two independent
          # builds of the same commit, same pinned toolchain and epoch, must
          # produce byte-identical output (`git clean -qfdx` between them so
          # the second is not merely reusing the first's object files). A
          # toolchain drifting under an unpinned tag, or a Kconfig default
          # changing upstream, shows up here as a build failure, not as a
          # silent difference discovered later by comparing against a stale
          # recorded pin.
          build /tmp/round1
          build /tmp/round2
          cmp /tmp/round1/u-boot.bin /tmp/round2/u-boot.bin ||
            { echo "two independent builds of $(git rev-parse HEAD) produced different bytes -- the build is not reproducible" >&2; exit 1; }
          echo "ok: two independent builds are byte-identical"
          cp /tmp/round1/u-boot.bin u-boot.bin
          cp /tmp/round1/.config .config

      - name: stamp
        run: |
          mkdir -p artifacts
          cp u-boot.bin artifacts/
          cp .config artifacts/u-boot.config
          ( cd artifacts && sha256sum u-boot.bin > SHA256SUMS )
          echo "--- version string baked into the binary ---"
          strings -t d artifacts/u-boot.bin | grep -m1 "U-Boot 20"

      - uses: actions/upload-artifact@v4
        with:
          name: u-boot-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

      - name: release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          body: |
            pi5 u-boot with `CONFIG_EFI_RT_VOLATILE_STORE`, built from the `hive` branch.

            Without it `talosctl upgrade` fails at the bootloader step with
            `failed to create efivarfs reader/writer: invalid argument`, because
            Linux only permits the efivarfs rw remount when the firmware
            advertises SetVariable at runtime.

            Verify with `sha256sum -c SHA256SUMS`.
